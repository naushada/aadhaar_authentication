# meta-uidai layer configuration.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "uidai"
BBFILE_PATTERN_uidai = "^${LAYERDIR}/"
BBFILE_PRIORITY_uidai = "6"

LAYERSERIES_COMPAT_uidai = "kirkstone langdale mickledore nanbield scarthgap styhead"

# Depends on core (openssl, libevent, cmake, pkgconfig) and the cmake bbclass.
LAYERDEPENDS_uidai = "core"
